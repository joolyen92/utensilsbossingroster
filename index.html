<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTENSILS • MapleStory M Expedition Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #07090e;
      --bg-surface: #0f131f;
      --bg-card: rgba(18, 23, 38, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(244, 63, 94, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #0d111d 0%, var(--bg-main) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* Top Navigation Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 60;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(7, 9, 14, 0.88);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .server-pill {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .nav-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-family: 'Space Grotesk', monospace;
    }

    /* Main Container */
    .main-wrap {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }

    /* Hero Headline & Controls */
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 22px;
    }

    .headline h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 75%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .headline p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-action.primary:hover {
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.6);
    }

    /* Filter Pill Navigation */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 24px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .pill-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 9px 20px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-tab.active {
      background: #ffffff;
      color: #090b11;
      border-color: #ffffff;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
      font-weight: 700;
    }

    /* Deck Layout */
    .decks-container {
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    .deck-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ==========================================================
       CINEMATIC BOSS POSTER BANNER (Catcha Gacha Event Style)
       ========================================================== */
    .boss-poster-card {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      min-height: 230px;
      display: flex;
      align-items: center;
      padding: 34px 40px;
      background-size: cover;
      background-position: center right;
    }

    /* Custom Boss Themes with Illustrated Art Vignettes */
    .poster-lotus {
      background: 
        linear-gradient(90deg, #090c17 0%, rgba(9, 12, 23, 0.94) 45%, rgba(15, 23, 42, 0.4) 100%),
        radial-gradient(circle at 80% 50%, rgba(56, 189, 248, 0.35) 0%, transparent 60%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1400&auto=format&fit=crop');
      background-size: cover;
      border-color: rgba(56, 189, 248, 0.3);
    }

    .poster-damien {
      background: 
        linear-gradient(90deg, #12090b 0%, rgba(18, 9, 11, 0.94) 45%, rgba(38, 12, 16, 0.4) 100%),
        radial-gradient(circle at 80% 50%, rgba(239, 68, 68, 0.4) 0%, transparent 60%),
        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1400&auto=format&fit=crop');
      background-size: cover;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .poster-lucid {
      background: 
        linear-gradient(90deg, #14091c 0%, rgba(20, 9, 28, 0.94) 45%, rgba(46, 16, 68, 0.4) 100%),
        radial-gradient(circle at 80% 50%, rgba(217, 70, 239, 0.38) 0%, transparent 60%),
        url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1400&auto=format&fit=crop');
      background-size: cover;
      border-color: rgba(217, 70, 239, 0.35);
    }

    .poster-cra {
      background: 
        linear-gradient(90deg, #0e121a 0%, rgba(14, 18, 26, 0.94) 45%, rgba(20, 30, 48, 0.4) 100%),
        radial-gradient(circle at 80% 50%, rgba(245, 158, 11, 0.35) 0%, transparent 60%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1400&auto=format&fit=crop');
      background-size: cover;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .poster-content {
      position: relative;
      z-index: 2;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .poster-badges {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tier-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .tier-hard { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid #ef4444; }
    .tier-chaos { background: rgba(217, 70, 239, 0.25); color: #f0abfc; border: 1px solid #d946ef; }

    .req-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .poster-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.8);
    }

    .poster-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .poster-tactics {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      border-left: 3px solid var(--accent-gold);
      padding: 8px 14px;
      border-radius: 0 10px 10px 0;
      font-size: 0.84rem;
      color: #f1f5f9;
      margin-top: 4px;
    }

    /* Poster Right: Quick Progress Metric */
    .poster-stats-box {
      margin-left: auto;
      background: rgba(8, 11, 20, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      min-width: 170px;
    }

    .poster-stats-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .poster-stats-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }

    .poster-progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 4px;
    }

    .poster-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      border-radius: 100px;
      transition: width 0.3s ease;
    }

    /* ==========================================================
       HOLOGRAPHIC 3D CATCHA CARDS
       ========================================================== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
      perspective: 1200px;
    }

    .gacha-card-wrapper {
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.22s ease-out, box-shadow 0.22s ease-out;
    }

    .gacha-card-wrapper:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .gacha-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    /* Holographic Light Sheen */
    .card-holo-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        125deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.04) 30%,
        rgba(236, 72, 153, 0.18) 45%,
        rgba(6, 182, 212, 0.2) 55%,
        rgba(255, 255, 255, 0.15) 60%,
        rgba(255, 255, 255, 0) 100%
      );
      mix-blend-mode: color-dodge;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .gacha-card-wrapper:hover .card-holo-sheen {
      opacity: 1;
    }

    .card-rarity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
      z-index: 2;
    }

    .rarity-pill {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .rarity-arcane {
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
    }
    .rarity-mythic {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #ffffff;
    }
    .rarity-legend {
      background: rgba(6, 182, 212, 0.2);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    .card-stars {
      color: #fbbf24;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
    }

    .card-art-box {
      height: 110px;
      margin: 4px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .art-glow {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
      filter: blur(12px);
    }

    .character-avatar {
      font-size: 3rem;
      z-index: 2;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6));
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gacha-card-wrapper:hover .character-avatar {
      transform: scale(1.12);
    }

    .card-details {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    .card-char-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-job-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .card-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-cell-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .stat-cell-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-cell-val.power {
      color: var(--accent-gold);
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    /* Foil Status Button */
    .status-foil-seal {
      width: 100%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .status-ready {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .status-cleared {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
    }

    .status-sub {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.5);
      animation: alertPulse 1.4s infinite;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show { display: flex; }

    .modal-card {
      background: #111524;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .form-item {
      margin-bottom: 16px;
    }

    .form-item label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-field, .select-field {
      width: 100%;
      background: #090c17;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 11px 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 14px rgba(139, 92, 246, 0.3);
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-pill.visible {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 820px) {
      .boss-poster-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 24px 20px;
        gap: 20px;
      }
      .poster-stats-box {
        margin-left: 0;
        width: 100%;
        align-items: flex-start;
      }
      .hero-top-row { flex-direction: column; align-items: flex-start; }
      .nav-stats { display: none; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="brand-wrap">
      <div class="brand-logo">🎴</div>
      <div>
        <div class="brand-title">UTENSILS <span class="server-pill">Asia 2 • Scania</span></div>
      </div>
    </div>

    <div class="nav-stats">
      <div class="stat-pill">
        <span>Reset:</span>
        <strong id="live-countdown">--d --h --m</strong>
      </div>
      <div class="stat-pill">
        <span>Total Cleared:</span>
        <strong id="global-clear-pct">0%</strong>
      </div>
    </div>
  </nav>

  <div class="main-wrap">
    
    <!-- Hero Header -->
    <header class="hero-top-row">
      <div class="headline">
        <h1>Boss Expedition Cards</h1>
        <p>Interactive weekly commander rosters. Click any character card to cycle clear status!</p>
      </div>

      <div class="hero-actions">
        <button class="btn-action" onclick="toggleMute()" id="sound-btn">🔊 SFX On</button>

  <!-- Notification Toast -->
  <div class="toast-pill" id="toast">

  </div>

  <script>
    /* ==========================================================

    const DEFAULT_DECKS = [

          { ign: 'HolyHeals', job: 'Bishop', avatar: '✨', cp: '44.0M', role: 'Support / Shell', stars: '★★★★★', rarity: 'mythic', status: 'READY' },
          { ign: 'SoulTaker', job: 'Shade', avatar: '👊', cp: '48.0M', role: 'Binder / Split', stars: '★★★★★', rarity: 'legend', status: 'READY' },
          { ign: 'BowMastery', job: 'Bowmaster', avatar: '🏹', cp: '51.3M', role: 'Burst DPS', stars: '★★★★★', rarity: 'legend', status: 'READY' },
          { ign: 'LumiGlow', job: 'Luminous', avatar: '🔮', cp: '47.5M', role: 'Main DPS', stars: '★★★★★', rarity: 'legend', status: 'READY' }
        ]
      },
      {
        id: 'deck-cra',
        category: 'CRA',
        posterTheme: 'poster-cra',
        tier: 'Abyss Lord',
        difficulty: 'Chaos Mode',
        levelReq: 'Lv. 180+ • 35M+ CP Rec',
        bossName: 'CHAOS ROOT ABYSS',
        subName: 'Colosseum of the 4 Guardians',
        desc: 'Conquer the 4 seal guardians: Chaos Von Bon, Pierre, Crimson Queen, and the subterranean Chaos Vellum.',
        tactics: 'Pierre hat color match! Hold DPS before 30% HP and coordinate Shade/Bind split burst.',
        members: [
          { ign: 'VellfireBoss', job: 'Night Walker', avatar: '🥷', cp: '68.5M', role: 'Main DPS', stars: '★★★★★★★', rarity: 'arcane', status: 'CLEARED' },
          { ign: 'HolyMercy', job: 'Bishop', avatar: '✨', cp: '46.0M', role: 'Support / Shell', stars: '★★★★★', rarity: 'mythic', status: 'CLEARED' },
          { ign: 'CaptainTime', job: 'Buccaneer', avatar: '⚡', cp: '43.1M', role: 'Time Leap', stars: '★★★★★', rarity: 'legend', status: 'CLEARED' },
          { ign: 'BladeDancer', job: 'Dual Blade', avatar: '⚔️', cp: '61.0M', role: 'Burst DPS', stars: '★★★★★★', rarity: 'arcane', status: 'CLEARED' }
        ]
      }
    ];

    let decks = JSON.parse(localStorage.getItem('catcha_poster_msm_v1')) || DEFAULT_DECKS;
    let activeCategory = 'ALL';
    let sfxMuted = false;

    function persist() {
      localStorage.setItem('catcha_poster_msm_v1', JSON.stringify(decks));
      updateGlobalStats();
    }

    /* ==========================================================
       2. TACTILE AUDIO SYNTHESIZER
       ========================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function playSfx(type) {
      if (sfxMuted) return;
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if (type === 'card-click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, t);
        osc.frequency.exponentialRampToValueAtTime(700, t + 0.06);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
        osc.start(t);
        osc.stop(t + 0.07);
      } else if (type === 'card-clear') {
        [1046.5, 1318.5, 1567.9, 2093.0].forEach((freq, idx) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, t + idx * 0.05);
          g.gain.setValueAtTime(0.09, t + idx * 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.22);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t + idx * 0.05);
          o.stop(t + idx * 0.05 + 0.23);
        });
      } else if (type === 'card-sub') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, t);
        osc.frequency.linearRampToValueAtTime(180, t + 0.12);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.13);
      }
    }

    function toggleMute() {
      sfxMuted = !sfxMuted;
      document.getElementById('sound-btn').textContent = sfxMuted ? '🔇 SFX Off' : '🔊 SFX On';
    }

    /* ==========================================================
       3. RENDER BOSS POSTERS & CARDS
       ========================================================== */
    function render() {
      const container = document.getElementById('decks-container');
      container.innerHTML = '';

      const filtered = activeCategory === 'ALL' 
        ? decks 
        : decks.filter(d => d.category === activeCategory);

      filtered.forEach(deck => {
        const clearedCount = deck.members.filter(m => m.status === 'CLEARED').length;
        const totalCount = deck.members.length;
        const clearPct = Math.round((clearedCount / totalCount) * 100) || 0;

        const section = document.createElement('section');
        section.className = 'deck-section';

        let cardsHtml = '';
        deck.members.forEach((m, idx) => {
          const sealText = m.status === 'CLEARED' ? '✦ CLEARED' : (m.status === 'SUB' ? '⚠ SUB NEEDED' : 'READY');
          const sealClass = m.status === 'CLEARED' ? 'status-cleared' : (m.status === 'SUB' ? 'status-sub' : 'status-ready');

          cardsHtml += `
            <div class="gacha-card-wrapper" onclick="toggleSeal('${deck.id}', ${idx})" onmousemove="handleTilt(event, this)" onmouseleave="resetTilt(this)">
              <div class="gacha-card">
                <div class="card-holo-sheen"></div>
                
                <div class="card-rarity-row">
                  <span class="rarity-pill rarity-${m.rarity}">${m.rarity}</span>
                  <span class="card-stars">${m.stars}</span>
                </div>

                <div class="card-art-box">
                  <div class="art-glow"></div>
                  <div class="character-avatar">${m.avatar}</div>
                </div>

                <div class="card-details">
                  <div class="card-char-name">
                    <span>${escapeStr(m.ign)}</span>
                    <span class="card-job-badge">${escapeStr(m.job)}</span>
                  </div>

                  <div class="card-stats-grid">
                    <div class="stat-cell">
                      <span class="stat-cell-label">Combat Power</span>
                      <span class="stat-cell-val power">${m.cp}</span>
                    </div>
                    <div class="stat-cell">
                      <span class="stat-cell-label">Roster Role</span>
                      <span class="stat-cell-val">${m.role}</span>
                    </div>
                  </div>

                  <div class="status-foil-seal ${sealClass}">
                    ${sealText}
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        // Cinematic Boss Poster Top Banner
        section.innerHTML = `
          <div class="boss-poster-card ${deck.posterTheme}">
            <div class="poster-content">
              <div class="poster-badges">
                <span class="tier-badge ${deck.difficulty.includes('Chaos') ? 'tier-chaos' : 'tier-hard'}">${deck.difficulty}</span>
                <span class="req-badge">${deck.tier}</span>
                <span class="req-badge">${deck.levelReq}</span>
              </div>
              <h2 class="poster-title">${deck.bossName} <span style="font-size:0.5em; opacity:0.8; font-weight:600;">• ${deck.subName}</span></h2>
              <p class="poster-desc">${deck.desc}</p>
              <div class="poster-tactics">
                <span>💡 Tactics:</span>
                <span>${deck.tactics}</span>
              </div>
            </div>

            <div class="poster-stats-box">
              <span class="poster-stats-label">Squad Clearance</span>
              <div class="poster-stats-num">${clearedCount} / ${totalCount}</div>
              <div class="poster-progress-bar">
                <div class="poster-progress-fill" style="width: ${clearPct}%"></div>
              </div>
            </div>
          </div>

          <div class="card-grid">
            ${cardsHtml}
          </div>
        `;

        container.appendChild(section);
      });

      updateGlobalStats();
    }

    function toggleSeal(deckId, idx) {
      const deck = decks.find(d => d.id === deckId);
      if (!deck) return;
      const member = deck.members[idx];

      if (member.status === 'READY') {
        member.status = 'CLEARED';
        playSfx('card-clear');
      } else if (member.status === 'CLEARED') {
        member.status = 'SUB';
        playSfx('card-sub');
      } else {
        member.status = 'READY';
        playSfx('card-click');
      }

      persist();
      render();
    }

    function handleTilt(e, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -10;
      const rotateY = ((x - centerX) / centerX) * 10;

      cardEl.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    }

    function resetTilt(cardEl) {
      cardEl.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.pill-tab').forEach(b => {
        b.classList.remove('active');
        if (b.textContent.toUpperCase().includes(cat === 'ALL' ? 'ALL' : cat)) {
          b.classList.add('active');
        }
      });
      playSfx('card-click');
      render();
    }

    function updateGlobalStats() {
      let total = 0;
      let cleared = 0;
      decks.forEach(d => {
        total += d.members.length;
        cleared += d.members.filter(m => m.status === 'CLEARED').length;
      });
      const pct = total === 0 ? 0 : Math.round((cleared / total) * 100);
      document.getElementById('global-clear-pct').textContent = `${pct}% (${cleared}/${total})`;
    }

    /* ==========================================================
       4. RESET COUNTDOWN TIMER (Thursday 00:00 SGT)
       ========================================================== */
    function updateCountdown() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const serverTime = new Date(utc + 8 * 3600000); // UTC+8

      let target = new Date(serverTime);
      const day = serverTime.getDay();
      let diffDays = (4 - day + 7) % 7;
      if (diffDays === 0 && (serverTime.getHours() > 0 || serverTime.getMinutes() > 0 || serverTime.getSeconds() > 0)) {
        diffDays = 7;
      }
      target.setDate(serverTime.getDate() + diffDays);
      target.setHours(0, 0, 0, 0);

      const diff = target.getTime() - serverTime.getTime();
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);

      document.getElementById('live-countdown').textContent = `${d}d ${h}h ${m}m`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    /* ==========================================================
       5. MODAL FORM ACTIONS
       ========================================================== */
    const jobAvatars = {
      'Night Walker': '🥷', 'Bishop': '✨', 'Sia Astelle': '⭐', 'Paladin': '🛡️',
      'Shade': '👊', 'Dual Blade': '⚔️', 'Buccaneer': '⚡', 'Hero': '🪓',
      'Bowmaster': '🏹', 'Luminous': '🔮', 'Phantom': '🃏', 'Adele': '🗡️'
    };

    function openAddModal() {
      const select = document.getElementById('form-deck-id');
      select.innerHTML = decks.map(d => `<option value="${d.id}">${escapeStr(d.bossName)} - ${escapeStr(d.subName)}</option>`).join('');
      document.getElementById('add-modal').classList.add('show');
      playSfx('card-click');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('show');
    }

    function saveNewRaider() {
      const deckId = document.getElementById('form-deck-id').value;
      const ign = document.getElementById('form-ign').value.trim();
      const job = document.getElementById('form-job').value;
      const cpVal = document.getElementById('form-cp').value.trim() || '45';
      const role = document.getElementById('form-role').value;

      if (!ign) {
        alert('Please enter an IGN!');
        return;
      }

      const deck = decks.find(d => d.id === deckId);
      if (deck) {
        deck.members.push({
          ign: ign,
          job: job,
          avatar: jobAvatars[job] || '⚔️',
          cp: `${cpVal}M`,
          role: role,
          stars: '★★★★★',
          rarity: parseFloat(cpVal) >= 60 ? 'arcane' : (parseFloat(cpVal) >= 50 ? 'mythic' : 'legend'),
          status: 'READY'
        });
        persist();
        render();
        closeAddModal();
        playSfx('card-clear');
        document.getElementById('form-ign').value = '';
        document.getElementById('form-cp').value = '';
      }
    }

    /* ==========================================================
       6. DISCORD EXPORT
       ========================================================== */
    function copyDiscordRoster() {
      let out = `🎴 **UTENSILS EXPEDITION ROSTER • ASIA 2 SCANIA**\n`;
      decks.forEach(d => {
        const clears = d.members.filter(m => m.status === 'CLEARED').length;
        out += `\n⚔️ **${d.bossName} (${d.difficulty})** [${clears}/${d.members.length} Cleared]\n`;
        d.members.forEach(m => {
          const seal = m.status === 'CLEARED' ? '✅ [CLEARED]' : (m.status === 'SUB' ? '🚨 [SUB NEEDED]' : '🟡 [READY]');
          out += `• ${seal} **${m.ign}** (${m.job} | ${m.cp} | ${m.role})\n`;
        });
      });

      navigator.clipboard.writeText(out).then(() => {
        playSfx('card-clear');
        const toast = document.getElementById('toast');
        toast.classList.add('visible');
        setTimeout(() => toast.classList.remove('visible'), 3200);
      });
    }

    function escapeStr(str) {
      return str.replace(/[&<>'"]/g, 
        t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)
      );
    }

    render();
  </script>
