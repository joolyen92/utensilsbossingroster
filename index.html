<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTENSILS • MapleStory M Bossing Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --maple-orange: #ff7700;
      --maple-gold: #ffbe1a;
      --maple-yellow: #fff066;
      --arcane-blue: #38bdf8;
      --arcane-purple: #a855f7;
      --card-bg: rgba(20, 24, 45, 0.82);
      --card-border: rgba(168, 85, 247, 0.35);
      --ready-color: #facc15;
      --cleared-color: #22c55e;
      --sub-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 50%, #090d16 100%);
      color: #f1f5f9;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Falling Maple Leaves & Starfield Canvas */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* Header & Animated Mascot Theater */
    .hero-banner {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.9), rgba(59, 7, 100, 0.85));
      border: 3px solid #ffbe1a;
      border-radius: 28px;
      padding: 28px 24px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(255, 190, 26, 0.25);
      position: relative;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: visible;
    }

    /* Bouncing Orange Mushroom Mascot */
    .mascot-mushroom {
      position: absolute;
      top: -46px;
      left: 32px;
      width: 82px;
      height: 82px;
      animation: mapleBounce 1.4s ease-in-out infinite alternate;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.5));
    }

    /* Floating Pink Bean Mascot */
    .mascot-pinkbean {
      position: absolute;
      top: -44px;
      right: 32px;
      width: 84px;
      height: 84px;
      animation: mapleFloat 2.8s ease-in-out infinite alternate;
      filter: drop-shadow(0 12px 18px rgba(236, 72, 153, 0.45));
    }

    /* Mascot Keyframes */
    @keyframes mapleBounce {
      0% { transform: translateY(0) scale(1.05, 0.92); }
      50% { transform: translateY(-22px) scale(0.96, 1.06); }
      100% { transform: translateY(0) scale(1, 0.96); }
    }

    @keyframes mapleFloat {
      0% { transform: translateY(0) rotate(-4deg); }
      100% { transform: translateY(-16px) rotate(4deg); }
    }

    @keyframes slimeSquish {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.15, 0.85) translateY(4px); }
    }

    .guild-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #ff7700, #ffbe1a);
      color: #3b0764;
      font-family: 'Fredoka', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(255, 119, 0, 0.4);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffffff 25%, #ffbe1a 75%, #ff7700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 6px 20px rgba(255, 119, 0, 0.4);
      margin-bottom: 8px;
    }

    .sub-title {
      color: #cbd5e1;
      font-size: 1rem;
      max-width: 640px;
      margin-bottom: 18px;
    }

    /* Reset Bar styled like Maple EXP/Server Bar */
    .reset-clock-card {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 190, 26, 0.4);
      padding: 10px 24px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Fredoka', cursive;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .reset-label {
      color: var(--maple-yellow);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .countdown-digits {
      font-family: 'Press Start 2P', monospace;
      color: #38bdf8;
      font-size: 0.85rem;
      background: #020617;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      letter-spacing: 2px;
    }

    /* Control Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .boss-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-tab {
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 12px;
      font-family: 'Fredoka', cursive;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-tab:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-tab.active {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      border-color: #ffbe1a;
      color: #fff;
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.5);
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    /* Chunky Maple Buttons */
    .btn-maple {
      background: linear-gradient(180deg, #ff9900 0%, #ff6600 100%);
      color: #fff;
      border: 2px solid #ffe600;
      border-radius: 14px;
      padding: 9px 18px;
      font-family: 'Fredoka', cursive;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 0 #b34700, 0 8px 18px rgba(255, 102, 0, 0.4);
      transition: all 0.1s ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .btn-maple:hover {
      background: linear-gradient(180deg, #ffa826 0%, #ff7711 100%);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #b34700, 0 12px 20px rgba(255, 102, 0, 0.5);
    }

    .btn-maple:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b34700, 0 3px 8px rgba(255, 102, 0, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
      border-color: #94a3b8;
      box-shadow: 0 5px 0 #1e293b, 0 6px 14px rgba(0,0,0,0.3);
    }
    .btn-secondary:hover {
      background: linear-gradient(180deg, #64748b 0%, #475569 100%);
      box-shadow: 0 7px 0 #1e293b, 0 10px 18px rgba(0,0,0,0.4);
    }
    .btn-secondary:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #1e293b;
    }

    /* Grid of Boss Squad Cards */
    .squad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }

    .boss-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .boss-card:hover {
      transform: translateY(-4px);
      border-color: #ffbe1a;
      box-shadow: 0 18px 40px rgba(168, 85, 247, 0.3);
    }

    /* Boss Header Banner */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.12);
      padding-bottom: 12px;
    }

    .boss-identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .boss-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #1e1b4b;
      border: 2px solid #a855f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
    }

    .boss-name {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }

    .boss-diff {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
      display: inline-block;
      margin-top: 2px;
    }
    .diff-hard { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .diff-chaos { background: rgba(217, 70, 239, 0.2); color: #e879f9; border: 1px solid #d946ef; }

    .party-counter {
      font-family: 'Fredoka', cursive;
      font-size: 0.85rem;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Raiders Slots */
    .raider-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .raider-slot {
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .raider-slot:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 190, 26, 0.5);
      transform: translateX(3px);
    }

    .raider-slot.status-cleared {
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(20, 83, 45, 0.25);
    }

    .raider-slot.status-sub {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(127, 29, 29, 0.25);
    }

    .raider-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .raider-job-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .raider-meta {
      display: flex;
      flex-direction: column;
    }

    .raider-ign {
      font-weight: 700;
      color: #f8fafc;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .raider-subinfo {
      font-size: 0.78rem;
      color: #94a3b8;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cp-tag {
      color: var(--maple-yellow);
      font-weight: 700;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.62rem;
    }

    /* Clearance Status Badges */
    .status-badge {
      font-family: 'Fredoka', cursive;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .badge-ready {
      background: rgba(250, 204, 21, 0.15);
      color: #fde047;
      border: 1px solid #facc15;
    }

    .badge-cleared {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }

    .badge-sub {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
      animation: pulseAlert 1.2s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(0.96); }
    }

    /* Boss Mechanics Quick Tips Box */
    .card-footer-tip {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border-left: 3px solid #ffbe1a;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .maple-modal {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border: 3px solid #ffbe1a;
      border-radius: 24px;
      padding: 26px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 190, 26, 0.25);
      position: relative;
    }

    .modal-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.5rem;
      color: var(--maple-yellow);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      background: #020617;
      border: 1.5px solid #334155;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus {
      border-color: #ffbe1a;
      box-shadow: 0 0 12px rgba(255, 190, 26, 0.3);
    }

    /* Floating Green Slime in bottom right */
    .mascot-slime {
      position: fixed;
      bottom: 24px;
      right: 28px;
      width: 68px;
      height: 68px;
      z-index: 50;
      cursor: pointer;
      animation: slimeSquish 2s ease-in-out infinite;
      filter: drop-shadow(0 10px 16px rgba(34, 197, 94, 0.45));
    }

    .slime-bubble {
      position: absolute;
      bottom: 80px;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #22c55e;
      color: #fff;
      padding: 6px 14px;
      border-radius: 14px;
      font-family: 'Fredoka', cursive;
      font-size: 0.85rem;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    .mascot-slime:hover .slime-bubble {
      opacity: 1;
      transform: translateY(0);
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      padding: 12px 24px;
      border-radius: 16px;
      font-family: 'Fredoka', cursive;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      border: 2px solid #a7f3d0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .mascot-mushroom, .mascot-pinkbean {
        width: 58px;
        height: 58px;
        top: -34px;
      }
      .mascot-mushroom { left: 10px; }
      .mascot-pinkbean { right: 10px; }
      .hero-banner { padding-top: 24px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .boss-tabs { justify-content: center; }
      .action-group { justify-content: center; }
      .mascot-slime { display: none; }
    }
  </style>
</head>
<body>

  <!-- Falling Maple Leaves & Ambient Star FX Canvas -->
  <canvas id="fx-canvas"></canvas>

  <div class="container">
    
    <!-- Top Hero Banner with Maple Mascots -->
    <header class="hero-banner">
      <!-- Animated Orange Mushroom SVG Mascot -->
      <div class="mascot-mushroom" title="Orange Mushroom!">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <ellipse cx="50" cy="92" rx="30" ry="7" fill="rgba(0,0,0,0.35)" />
          <!-- Mushroom Body/Stem -->
          <ellipse cx="50" cy="68" rx="28" ry="24" fill="#fff5ea" stroke="#4a2711" stroke-width="3.5" />
          <!-- Feet -->
          <ellipse cx="36" cy="88" rx="14" ry="7" fill="#fde68a" stroke="#4a2711" stroke-width="3" />
          <ellipse cx="64" cy="88" rx="14" ry="7" fill="#fde68a" stroke="#4a2711" stroke-width="3" />
          <!-- Cute Eyes & Blushes -->
          <ellipse cx="40" cy="68" rx="3.5" ry="5.5" fill="#2d1506" />
          <ellipse cx="60" cy="68" rx="3.5" ry="5.5" fill="#2d1506" />
          <ellipse cx="33" cy="74" rx="4.5" ry="2.5" fill="#f87171" opacity="0.6" />
          <ellipse cx="67" cy="74" rx="4.5" ry="2.5" fill="#f87171" opacity="0.6" />
          <path d="M 46 75 Q 50 79 54 75" stroke="#2d1506" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Vibrant Orange Mushroom Cap -->
          <path d="M 10 52 C 10 20, 90 20, 90 52 C 90 58, 80 58, 50 56 C 20 58, 10 58, 10 52 Z" fill="#ff5a00" stroke="#4a2711" stroke-width="3.5"/>
          <!-- Cap White Spots -->
          <ellipse cx="28" cy="38" rx="7" ry="5" fill="#fff" opacity="0.95" />
          <ellipse cx="50" cy="28" rx="9" ry="6" fill="#fff" opacity="0.95" />
          <ellipse cx="72" cy="38" rx="7" ry="5" fill="#fff" opacity="0.95" />
        </svg>
      </div>

      <!-- Animated Pink Bean SVG Mascot -->
      <div class="mascot-pinkbean" title="Pink Bean!">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <ellipse cx="50" cy="94" rx="32" ry="6" fill="rgba(0,0,0,0.3)" />
          <!-- Horns -->
          <polygon points="32,24 24,6 40,16" fill="#4c1d95" stroke="#2e1065" stroke-width="3" />
          <polygon points="68,24 76,6 60,16" fill="#4c1d95" stroke="#2e1065" stroke-width="3" />
          <!-- Plump Pink Bean Body -->
          <ellipse cx="50" cy="56" rx="36" ry="36" fill="#f472b6" stroke="#831843" stroke-width="3.5" />
          <!-- White Belly -->
          <ellipse cx="50" cy="65" rx="22" ry="20" fill="#fdf2f8" opacity="0.9" />
          <!-- Cute Eyes & Rosy Cheeks -->
          <circle cx="38" cy="50" r="4" fill="#500724" />
          <circle cx="62" cy="50" r="4" fill="#500724" />
          <circle cx="39" cy="49" r="1.3" fill="#fff" />
          <circle cx="63" cy="49" r="1.3" fill="#fff" />
          <ellipse cx="30" cy="57" rx="5" ry="3" fill="#fb7185" />
          <ellipse cx="70" cy="57" rx="5" ry="3" fill="#fb7185" />
          <path d="M 46 56 Q 50 61 54 56" stroke="#500724" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Tiny Feet -->
          <ellipse cx="34" cy="90" rx="10" ry="6" fill="#ec4899" stroke="#831843" stroke-width="3" />
          <ellipse cx="66" cy="90" rx="10" ry="6" fill="#ec4899" stroke="#831843" stroke-width="3" />
          <!-- Mini Golden Trident -->
          <path d="M 78 30 L 78 80" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
          <path d="M 72 32 Q 78 40 84 32" stroke="#f59e0b" stroke-width="3" fill="none"/>
        </svg>
      </div>

      <div class="guild-tag">🍁 Asia 2 • Scania • UTENSILS Guild</div>
      <h1 class="main-title">EXPEDITION & BOSS ROSTER</h1>
      <p class="sub-title">Weekly Commander & Root Abyss clearance hub. Click on any member to toggle clearance status!</p>

      <!-- Weekly Reset Countdown Bar -->
      <div class="reset-clock-card">
        <span class="reset-label">⏳ WEEKLY RESET (THU 00:00 SGT):</span>
        <span class="countdown-digits" id="reset-timer">--d --h --m --s</span>
      </div>
    </header>

    <!-- Toolbar: Filter Tabs & Action Buttons -->
    <section class="toolbar">
      <div class="boss-tabs">

  <!-- Notification Toast -->

  <script>
    /* ==========================================================
       1. DATA STRUCTURE & INITIAL ROSTER
       ========================================================== */
    const DEFAULT_DATA = [
      {
        id: 'squad-lotus-1',
        bossKey: 'LOTUS',

        difficulty: 'Hard',

        ]
      },
      {

        bossKey: 'DAMIEN',

        difficulty: 'Hard',
        icon: '⚔️',
        tip: 'Cleanse stigma brands at altars before 7 stacks! Save burst binds when Damien descends.',
        members: [
          { ign: 'VellfireBoss', job: 'Night Walker', cp: '68.5M', role: 'Main DPS', status: 'READY' },
          { ign: 'BladeDancer', job: 'Dual Blade', cp: '61.0M', role: 'Burst DPS', status: 'READY' },
          { ign: 'HolyMercy', job: 'Bishop', cp: '45.0M', role: 'Healer / Bishop', status: 'READY' },
          { ign: 'PhantomThief', job: 'Phantom', cp: '49.5M', role: 'Main DPS', status: 'READY' },
          { ign: 'SubWarrior', job: 'Hero', cp: '39.0M', role: 'Burst DPS', status: 'SUB' },
          { ign: 'OpenSpot', job: 'Paladin', cp: '40.0M', role: 'Main DPS', status: 'READY' }
        ]
      },
      {
        id: 'squad-lucid-1',
        bossKey: 'LUCID',
        bossName: 'Hard Lucid (Dream Realm)',
        difficulty: 'Hard',
        icon: '🦋',
        tip: 'Clear nightmare butterflies regularly. Group up for dragon breath survival on golems.',
        members: [
          { ign: 'StarSia', job: 'Sia Astelle', cp: '54.2M', role: 'Main DPS', status: 'READY' },
          { ign: 'NightSlayer', job: 'Night Walker', cp: '58.0M', role: 'Main DPS', status: 'READY' },
          { ign: 'HolyHeals', job: 'Bishop', cp: '44.0M', role: 'Healer / Bishop', status: 'READY' },
          { ign: 'SoulTaker', job: 'Shade', cp: '48.0M', role: 'Binder / Splitter', status: 'READY' },
          { ign: 'BowMastery', job: 'Bowmaster', cp: '51.3M', role: 'Burst DPS', status: 'READY' },
          { ign: 'LumiGlow', job: 'Luminous', cp: '47.5M', role: 'Main DPS', status: 'READY' }
        ]
      },
      {
        id: 'squad-cra-1',
        bossKey: 'CRA',
        bossName: 'Chaos Root Abyss (4 Doors)',
        difficulty: 'Chaos',
        icon: '👑',
        tip: 'Pierre hat color match! Split Pierre when under 30% HP using Shade/Bind burst.',
        members: [
          { ign: 'VellfireBoss', job: 'Night Walker', cp: '68.5M', role: 'Main DPS', status: 'CLEARED' },
          { ign: 'HolyMercy', job: 'Bishop', cp: '45.0M', role: 'Healer / Bishop', status: 'CLEARED' },
          { ign: 'CaptainTime', job: 'Buccaneer', cp: '42.1M', role: 'Time Leap Support', status: 'CLEARED' },
          { ign: 'BladeDancer', job: 'Dual Blade', cp: '61.0M', role: 'Burst DPS', status: 'CLEARED' }
        ]
      }
    ];

    let squads = JSON.parse(localStorage.getItem('msm_maple_roster_v2')) || DEFAULT_DATA;
    let currentFilter = 'ALL';
    let audioEnabled = true;

    function saveState() {
      localStorage.setItem('msm_maple_roster_v2', JSON.stringify(squads));
    }

    /* ==========================================================
       2. MAPLE SOUND SYNTHESIZER (Web Audio API)
       ========================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
      if (!actx) {
        actx = new AudioCtx();
      }
      if (actx.state === 'suspended') {
        actx.resume();
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-btn').textContent = audioEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    }

    function playMapleSfx(type) {
      if (!audioEnabled) return;
      initAudio();

      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if (type === 'click') {
        // Crisp meso pickup blip
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === 'clear') {
        // Classic 8-bit style Maple Level Up arpeggio
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const subOsc = actx.createOscillator();
          const subGain = actx.createGain();
          subOsc.type = 'square';
          subOsc.frequency.setValueAtTime(freq, now + idx * 0.07);
          subGain.gain.setValueAtTime(0.12, now + idx * 0.07);
          subGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.18);
          subOsc.connect(subGain);
          subGain.connect(actx.destination);
          subOsc.start(now + idx * 0.07);
          subOsc.stop(now + idx * 0.07 + 0.19);
        });
      } else if (type === 'sub') {
        // Red warning double buzz
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.setValueAtTime(240, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.19);
      } else if (type === 'slime') {
        // Bloop jiggle tone
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.16);
      }
    }

    /* ==========================================================
       3. RENDER ENGINE
       ========================================================= */
    const jobIcons = {
      'Night Walker': '🗡️',
      'Bishop': '✨',
      'Sia Astelle': '⭐',
      'Paladin': '🛡️',
      'Shade': '👊',
      'Dual Blade': '⚔️',
      'Buccaneer': '⚡',
      'Hero': '🪓',
      'Bowmaster': '🏹',
      'Luminous': '🔮',
      'Phantom': '🃏',
      'Adele': '🗡️'
    };

    function renderSquads() {
      const container = document.getElementById('squad-container');
      container.innerHTML = '';

      const filtered = currentFilter === 'ALL' 
        ? squads 
        : squads.filter(s => s.bossKey === currentFilter);

      filtered.forEach((squad) => {
        const card = document.createElement('article');
        card.className = 'boss-card';

        const clearedCount = squad.members.filter(m => m.status === 'CLEARED').length;
        const totalCount = squad.members.length;

        let membersHtml = '';
        squad.members.forEach((m, idx) => {
          const statusClass = m.status === 'CLEARED' ? 'status-cleared' : (m.status === 'SUB' ? 'status-sub' : '');
          const badgeClass = m.status === 'CLEARED' ? 'badge-cleared' : (m.status === 'SUB' ? 'badge-sub' : 'badge-ready');
          const badgeText = m.status === 'CLEARED' ? '⭐ CLEARED' : (m.status === 'SUB' ? '🔴 SUB NEEDED' : '🟡 READY');
          const jobIcon = jobIcons[m.job] || '⚔️';

          membersHtml += `
            <div class="raider-slot ${statusClass}" onclick="cycleStatus('${squad.id}', ${idx})">
              <div class="raider-left">
                <div class="raider-job-badge">${jobIcon}</div>
                <div class="raider-meta">
                  <div class="raider-ign">${escapeHtml(m.ign)}</div>
                  <div class="raider-subinfo">
                    <span>${escapeHtml(m.job)}</span> • 
                    <span class="cp-tag">${m.cp}</span> • 
                    <span>${m.role}</span>
                  </div>
                </div>
              </div>
              <div class="status-badge ${badgeClass}">${badgeText}</div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="card-top">
            <div class="boss-identity">
              <div class="boss-icon-wrap">${squad.icon}</div>
              <div>
                <div class="boss-name">${escapeHtml(squad.bossName)}</div>
                <span class="boss-diff ${squad.difficulty === 'Chaos' ? 'diff-chaos' : 'diff-hard'}">${squad.difficulty} MODE</span>
              </div>
            </div>
            <div class="party-counter">${clearedCount} / ${totalCount} Cleared</div>
          </div>

          <div class="raider-list">
            ${membersHtml}
          </div>

          <div class="card-footer-tip">
            <span>💡</span>
            <span>${escapeHtml(squad.tip)}</span>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function cycleStatus(squadId, memberIdx) {
      const squad = squads.find(s => s.id === squadId);
      if (!squad) return;
      const member = squad.members[memberIdx];

      if (member.status === 'READY') {
        member.status = 'CLEARED';
        playMapleSfx('clear');
      } else if (member.status === 'CLEARED') {
        member.status = 'SUB';
        playMapleSfx('sub');
      } else {
        member.status = 'READY';
        playMapleSfx('click');
      }

      saveState();
      renderSquads();
    }

    function filterBoss(bossKey) {
      currentFilter = bossKey;
      document.querySelectorAll('.btn-tab').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.includes(bossKey === 'ALL' ? 'All' : bossKey)) {
          btn.classList.add('active');
        }
      });
      playMapleSfx('click');
      renderSquads();
    }

    /* ==========================================================
       4. RESET COUNTDOWN TIMER (Thursday 00:00 SGT / UTC+8)
       ========================================================== */
    function updateResetCountdown() {
      const timerEl = document.getElementById('reset-timer');
      const now = new Date();

      // Find next Thursday 00:00 UTC+8 (Server Time)
      // Convert now to UTC milliseconds
      const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
      const serverOffset = 8 * 3600000;
      const serverTime = new Date(utcTime + serverOffset);

      let targetReset = new Date(serverTime);
      const dayOfWeek = serverTime.getDay(); // 0 = Sun, 4 = Thu
      let daysUntilThursday = (4 - dayOfWeek + 7) % 7;

      if (daysUntilThursday === 0 && (serverTime.getHours() > 0 || serverTime.getMinutes() > 0 || serverTime.getSeconds() > 0)) {
        daysUntilThursday = 7;
      }

      targetReset.setDate(serverTime.getDate() + daysUntilThursday);
      targetReset.setHours(0, 0, 0, 0);

      const diff = targetReset.getTime() - serverTime.getTime();

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const pad = (n) => String(n).padStart(2, '0');
      timerEl.textContent = `${days}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
    }

    setInterval(updateResetCountdown, 1000);
    updateResetCountdown();

    /* ==========================================================
       5. MODAL: ADD NEW MEMBER
       ========================================================== */
    function openAddModal() {
      const select = document.getElementById('form-squad-select');
      select.innerHTML = squads.map(s => `<option value="${s.id}">${escapeHtml(s.bossName)}</option>`).join('');
      document.getElementById('add-modal').classList.add('active');
      playMapleSfx('click');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('active');
      playMapleSfx('click');
    }

    function submitNewMember() {
      const squadId = document.getElementById('form-squad-select').value;
      const ign = document.getElementById('form-ign').value.trim();
      const job = document.getElementById('form-job').value;
      const cpVal = document.getElementById('form-cp').value.trim() || '40';
      const role = document.getElementById('form-role').value;

      if (!ign) {
        alert('Please enter an IGN for the character!');
        return;
      }

      const squad = squads.find(s => s.id === squadId);
      if (squad) {
        squad.members.push({
          ign: ign,
          job: job,
          cp: `${cpVal}M`,
          role: role,
          status: 'READY'
        });
        saveState();
        renderSquads();
        closeAddModal();
        playMapleSfx('clear');
        document.getElementById('form-ign').value = '';
        document.getElementById('form-cp').value = '';
      }
    }

    /* ==========================================================
       6. DISCORD ROSTER EXPORTER
       ========================================================== */
    function exportDiscord() {
      let output = `🍁 **UTENSILS EXPEDITION ROSTER • MAPLESTORY M** 🍁\n`;
      output += `*Weekly Server Reset: Thursdays 00:00 SGT*\n\n`;

      squads.forEach(s => {
        output += `⚔️ **${s.bossName}** [${s.members.filter(m => m.status === 'CLEARED').length}/${s.members.length} CLEARED]\n`;
        s.members.forEach(m => {
          const statusEmoji = m.status === 'CLEARED' ? '✅ [CLEARED]' : (m.status === 'SUB' ? '🚨 [SUB NEEDED]' : '🟡 [READY]');
          output += `• ${statusEmoji} **${m.ign}** (${m.job} | ${m.cp} | ${m.role})\n`;
        });
        output += `\n`;
      });

      navigator.clipboard.writeText(output).then(() => {
        playMapleSfx('clear');
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* ==========================================================
       7. FALLING MAPLE LEAVES & PARTICLES (CANVAS)
       ========================================================== */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    const leaves = [];
    const stars = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Create Autumn Leaves
    for (let i = 0; i < 28; i++) {
      leaves.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: 14 + Math.random() * 16,
        speedY: 0.9 + Math.random() * 1.6,
        speedX: -0.6 + Math.random() * 1.2,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.04,
        swayAmplitude: 20 + Math.random() * 30,
        swaySpeed: 0.02 + Math.random() * 0.03,
        swayOffset: Math.random() * Math.PI * 2,
        color: ['#ff5a00', '#ff9900', '#ffbe1a', '#e11d48', '#d97706'][Math.floor(Math.random() * 5)]
      });
    }

    // Create Ambient Dream Stars
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.6 + 0.4,
        alpha: Math.random(),
        speed: 0.015 + Math.random() * 0.02
      });
    }

    function drawMapleLeaf(ctx, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      // Stylized 5-pointed Maple Leaf silhouette
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.35, -size * 0.45);
      ctx.lineTo(size * 0.85, -size * 0.55);
      ctx.lineTo(size * 0.45, -size * 0.1);
      ctx.lineTo(size * 0.75, size * 0.45);
      ctx.lineTo(size * 0.25, size * 0.35);
      ctx.lineTo(0, size * 0.85); // stem base
      ctx.lineTo(-size * 0.25, size * 0.35);
      ctx.lineTo(-size * 0.75, size * 0.45);
      ctx.lineTo(-size * 0.45, -size * 0.1);
      ctx.lineTo(-size * 0.85, -size * 0.55);
      ctx.lineTo(-size * 0.35, -size * 0.45);
      ctx.closePath();
      ctx.fill();
    }

    function animateFX() {
      ctx.clearRect(0, 0, width, height);

      // Render Twinkling Stars
      stars.forEach(s => {
        s.alpha += s.speed;
        const currentAlpha = Math.abs(Math.sin(s.alpha));
        ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha * 0.75})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Falling Maple Leaves
      leaves.forEach(l => {
        l.y += l.speedY;
        l.swayOffset += l.swaySpeed;
        l.x += l.speedX + Math.sin(l.swayOffset) * 0.8;
        l.rotation += l.rotationSpeed;

        if (l.y > height + 40) {
          l.y = -30;
          l.x = Math.random() * width;
        }
        if (l.x > width + 40) l.x = -30;
        if (l.x < -40) l.x = width + 30;

        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rotation);
        drawMapleLeaf(ctx, l.size, l.color);
        ctx.restore();
      });

      requestAnimationFrame(animateFX);
    }

    // Start Everything
    renderSquads();
    animateFX();
