<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTENSILS • MapleStory M Expedition Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #07090e;
      --bg-surface: #0f131f;
      --bg-card: rgba(18, 23, 38, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(244, 63, 94, 0.12) 0%, transparent 45%),
        linear-gradient(180deg, #0d111d 0%, var(--bg-main) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 120px;
    }

    /* Top Catcha Navigation */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 60;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(7, 9, 14, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .server-pill {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .nav-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-family: 'Space Grotesk', monospace;
    }

    /* Main Container */
    .main-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }

    /* Hero Headline & Controls */
    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 22px;
    }

    .headline h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 75%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .headline p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-action.primary:hover {
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.6);
    }

    /* Filter Pill Navigation */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 24px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .pill-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 9px 20px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-tab.active {
      background: #ffffff;
      color: #090b11;
      border-color: #ffffff;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
      font-weight: 700;
    }

    /* Boss Section Layout */
    .boss-list-container {
      display: flex;
      flex-direction: column;
      gap: 56px;
    }

    .boss-section {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ==========================================================
       CINEMATIC BOSS EVENT POSTERS (FEATURING TRANSPARENT CUTOUTS)
       ========================================================== */
    .boss-poster-card {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 34px 44px;
    }

    /* Boss Theme Backgrounds */
    .theme-vhilla {
      background: linear-gradient(135deg, #120409 0%, #1f0814 45%, #05140b 100%);
      border-color: rgba(239, 68, 68, 0.4);
      --boss-glow: rgba(239, 68, 68, 0.35);
      --card-accent: #ef4444;
    }

    .theme-lucid {
      background: linear-gradient(135deg, #13041a 0%, #20082b 45%, #080d22 100%);
      border-color: rgba(217, 70, 239, 0.4);
      --boss-glow: rgba(217, 70, 239, 0.35);
      --card-accent: #d946ef;
    }

    .theme-azazelle {
      background: linear-gradient(135deg, #0e0717 0%, #180928 45%, #1d1003 100%);
      border-color: rgba(168, 85, 247, 0.4);
      --boss-glow: rgba(168, 85, 247, 0.35);
      --card-accent: #a855f7;
    }

    .theme-will {
      background: linear-gradient(135deg, #040914 0%, #081226 45%, #181404 100%);
      border-color: rgba(56, 189, 248, 0.4);
      --boss-glow: rgba(56, 189, 248, 0.35);
      --card-accent: #38bdf8;
    }

    .poster-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .poster-badges {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tier-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .tier-chaos { background: rgba(217, 70, 239, 0.25); color: #f0abfc; border: 1px solid #d946ef; }
    .tier-hard { background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid #ef4444; }

    .req-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .poster-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.1rem, 3.8vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .poster-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .poster-tactics {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.45);
      border-left: 3px solid var(--accent-gold);
      padding: 8px 14px;
      border-radius: 0 10px 10px 0;
      font-size: 0.84rem;
      color: #f1f5f9;
      margin-top: 4px;
    }

    /* Right Showcase: Boss Art + Squad Metric */
    .poster-right-showcase {
      display: flex;
      align-items: center;
      gap: 30px;
      z-index: 2;
    }

    .boss-art-portrait-wrap {
      position: relative;
      width: 170px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .boss-art-halo {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--boss-glow) 0%, transparent 70%);
      filter: blur(16px);
      z-index: 1;
      animation: ambientPulse 3s ease-in-out infinite alternate;
    }

    .boss-transparent-img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.75));
      animation: floatArt 3.5s ease-in-out infinite alternate;
    }

    @keyframes floatArt {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.03); }
    }

    @keyframes ambientPulse {
      0% { opacity: 0.6; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    .poster-stats-box {
      background: rgba(8, 11, 20, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 160px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .poster-stats-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .poster-stats-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
    }

    .poster-progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 4px;
    }

    .poster-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      border-radius: 100px;
      transition: width 0.3s ease;
    }

    /* ==========================================================
       TEAM SECTIONS & CATCHA 3D CARDS
       ========================================================== */
    .team-block {
      background: rgba(16, 20, 34, 0.4);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 22px;
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }

    .team-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .team-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-badge-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--accent-cyan);
    }

    .team-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: #ffffff;
    }

    .team-meta-stat {
      font-size: 0.78rem;
      font-weight: 700;
      font-family: 'Space Grotesk', monospace;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      perspective: 1200px;
    }

    /* 3D Tilting Card */
    .gacha-card-wrapper {
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.22s ease-out, box-shadow 0.22s ease-out;
    }

    .gacha-card-wrapper:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .gacha-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      min-height: 250px;
    }

    /* Holographic Light Sheen */
    .card-holo-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        125deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.04) 30%,
        rgba(236, 72, 153, 0.18) 45%,
        rgba(6, 182, 212, 0.2) 55%,
        rgba(255, 255, 255, 0.15) 60%,
        rgba(255, 255, 255, 0) 100%
      );
      mix-blend-mode: color-dodge;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .gacha-card-wrapper:hover .card-holo-sheen {
      opacity: 1;
    }

    /* Empty Card Slot State */
    .gacha-card.empty-slot {
      border: 2px dashed rgba(255, 255, 255, 0.18);
      background: rgba(14, 18, 29, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
      gap: 10px;
      transition: all 0.2s ease;
      position: relative;
    }

    .gacha-card.empty-slot:hover {
      border-color: var(--card-accent, #8b5cf6);
      background: rgba(139, 92, 246, 0.08);
    }

    /* Watermark for empty card matched back to boss */
    .empty-boss-watermark {
      position: absolute;
      width: 90px;
      height: 90px;
      object-fit: contain;
      opacity: 0.1;
      filter: grayscale(1);
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .gacha-card.empty-slot:hover .empty-boss-watermark {
      opacity: 0.25;
      filter: grayscale(0);
      transform: scale(1.08);
    }

    .empty-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .empty-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #cbd5e1;
      z-index: 2;
    }

    .empty-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      z-index: 2;
    }

    /* Filled Card Styling */
    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px 6px;
      z-index: 2;
    }

    .rarity-pill {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .rarity-arcane {
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }
    .rarity-mythic {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #ffffff;
    }
    .rarity-legend {
      background: rgba(6, 182, 212, 0.2);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    .card-edit-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .card-edit-btn:hover {
      background: #ffffff;
      color: #000;
    }

    .card-art-box {
      height: 80px;
      margin: 2px 12px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .character-avatar {
      font-size: 2.5rem;
      z-index: 2;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
    }

    .card-details {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2;
    }

    .card-char-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-job-pill {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--border-subtle);
      display: inline-block;
    }

    .card-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 7px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stat-cell-label {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
    }

    .stat-cell-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-cell-val.power {
      color: var(--accent-gold);
    }

    /* Foil Status Seal */
    .status-foil-seal {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.74rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      margin-top: 2px;
    }

    .status-ready {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .status-cleared {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.3);
    }

    .status-sub {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.5);
      animation: alertPulse 1.4s infinite;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ==========================================================
       MODAL: ASSIGN / EDIT RAIDER
       ========================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 12, 0.88);
      backdrop-filter: blur(14px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show { display: flex; }

    /* ==========================================================
       2. TACTILE AUDIO SYNTHESIZER
       ========================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function playSfx(type) {
      if (sfxMuted) return;
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if (type === 'card-click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, t);
        osc.frequency.exponentialRampToValueAtTime(700, t + 0.06);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
        osc.start(t);
        osc.stop(t + 0.07);
      } else if (type === 'card-clear') {
        [1046.5, 1318.5, 1567.9, 2093.0].forEach((freq, idx) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, t + idx * 0.05);
          g.gain.setValueAtTime(0.09, t + idx * 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.22);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t + idx * 0.05);
          o.stop(t + idx * 0.05 + 0.23);
        });
      } else if (type === 'card-sub') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, t);
        osc.frequency.linearRampToValueAtTime(180, t + 0.12);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.13);
      }
    }

    function toggleMute() {
      sfxMuted = !sfxMuted;
      document.getElementById('sound-btn').textContent = sfxMuted ? '🔇 SFX Off' : '🔊 SFX On';
    }

    /* ==========================================================
       3. MAPLESTORY M GLOBAL CLASSES & ICONS
       ========================================================== */
    const jobAvatars = {
      // Sengoku & Special
      'Hayato': '🌸', 'Kanna': '🦊', 'Sia Astelle': '⭐', 'Zen': '🐉',

      // Nova & Flora
      'Adele': '🗡️', 'Ark': '🦾', 'Cadena': '⛓️', 'Kaiser': '🐉',
      'Angelic Buster': '💖', 'Illium': '🔮'
    };

    /* ==========================================================
       4. RENDER ENGINE: BOSSES, TEAMS & CARDS
       ========================================================== */
    function render() {
      const container = document.getElementById('boss-container');
      container.innerHTML = '';

      const filtered = activeCategory === 'ALL'
        ? bosses
        : bosses.filter(b => b.category === activeCategory);

      filtered.forEach(boss => {
        const section = document.createElement('section');
        section.className = 'boss-section';

        let totalAssigned = 0;
        let totalCleared = 0;
        boss.teams.forEach(t => {
          t.members.forEach(m => {
            if (m.ign) {
              totalAssigned++;
              if (m.status === 'CLEARED') totalCleared++;
            }
          });
        });
        const bossClearPct = totalAssigned > 0 ? Math.round((totalCleared / totalAssigned) * 100) : 0;

        let teamsHtml = '';
        boss.teams.forEach((team, teamIdx) => {
          const teamCleared = team.members.filter(m => m.ign && m.status === 'CLEARED').length;
          const teamFilled = team.members.filter(m => m.ign).length;

          let cardsHtml = '';
          team.members.forEach((m, slotIdx) => {
            if (!m.ign) {
              // Empty Slot Card with Boss Watermark
              cardsHtml += `
                <div class="gacha-card-wrapper" onclick="openModal('${boss.id}', ${teamIdx}, ${slotIdx})">
                  <div class="gacha-card empty-slot">
                    <img src="${boss.imageFile}" class="empty-boss-watermark" alt="${boss.bossName}" onerror="this.style.display='none'">
                    <div class="empty-icon-wrap">+</div>
                    <div class="empty-title">Slot ${slotIdx + 1}</div>
                    <div class="empty-desc">Tap to assign raider</div>
                  </div>
                </div>
              `;
            } else {
              // Filled Raider Card
              const avatar = jobAvatars[m.job] || '⚔️';
              const numCp = parseFloat(m.cp) || 0;
              const rarity = numCp >= 70 ? 'arcane' : (numCp >= 55 ? 'mythic' : 'legend');
              const sealText = m.status === 'CLEARED' ? '✦ CLEARED' : (m.status === 'SUB' ? '⚠ SUB NEEDED' : 'READY');
              const sealClass = m.status === 'CLEARED' ? 'status-cleared' : (m.status === 'SUB' ? 'status-sub' : 'status-ready');

              cardsHtml += `
                <div class="gacha-card-wrapper" onmousemove="handleTilt(event, this)" onmouseleave="resetTilt(this)">
                  <div class="gacha-card">
                    <div class="card-holo-sheen"></div>
                    
                    <div class="card-top-row">
                      <span class="rarity-pill rarity-${rarity}">${rarity}</span>
                      <button class="card-edit-btn" onclick="openModal('${boss.id}', ${teamIdx}, ${slotIdx}); event.stopPropagation();" title="Edit Raider">✎</button>

                    <div class="card-art-box" onclick="toggleSeal('${boss.id}', ${teamIdx}, ${slotIdx})">
                      <div class="character-avatar">${avatar}</div>
                    </div>

                    <div class="card-details" onclick="toggleSeal('${boss.id}', ${teamIdx}, ${slotIdx})">
                      <div class="card-char-name">${escapeStr(m.ign)}</div>
                      <div>
                        <span class="card-job-pill">${escapeStr(m.job || 'Class')}</span>
                      </div>

                      <div class="card-stats-grid">
                        <div class="stat-cell">
                          <span class="stat-cell-label">Combat Power</span>
                          <span class="stat-cell-val power">${m.cp ? m.cp + 'M' : '--'}</span>
                        </div>
                        <div class="stat-cell">
                          <span class="stat-cell-label">Role</span>
                          <span class="stat-cell-val" style="font-size:0.75rem;">${m.role || 'DPS'}</span>
                        </div>
                      </div>

                      <div class="status-foil-seal ${sealClass}">
                        ${sealText}
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }
          });

          teamsHtml += `
            <div class="team-block">
              <div class="team-header-row">
                <div class="team-title-wrap">
                  <div class="team-badge-icon">${teamIdx + 1}</div>
                  <div class="team-title">${escapeStr(team.name)}</div>
                </div>
                <div class="team-meta-stat">${teamCleared}/${teamFilled} Cleared (Max 6)</div>
              </div>
              <div class="card-grid">
                ${cardsHtml}
              </div>
            </div>
          `;
        });

        // Boss Poster with Transparent Cutout Art & Metagame Stats
        section.innerHTML = `
          <div class="boss-poster-card ${boss.posterTheme}">
            <div class="poster-content">
              <div class="poster-badges">
                <span class="tier-badge tier-chaos">${boss.difficulty}</span>
                <span class="req-badge">${boss.tier}</span>
                <span class="req-badge">${boss.levelReq}</span>
              </div>
              <h2 class="poster-title">${boss.bossName} <span style="font-size:0.5em; opacity:0.8; font-weight:600;">• ${boss.subName}</span></h2>
              <p class="poster-desc">${boss.desc}</p>
              <div class="poster-tactics">
                <span>💡 Tactics:</span>
                <span>${boss.tactics}</span>
              </div>
            </div>

            <div class="poster-right-showcase">
              <div class="boss-art-portrait-wrap">
                <div class="boss-art-halo"></div>
                <img src="${boss.imageFile}" class="boss-transparent-img" alt="${boss.bossName}" onerror="this.style.opacity='0.2'">
              </div>

              <div class="poster-stats-box">
                <span class="poster-stats-label">Boss Cleared</span>
                <div class="poster-stats-num">${totalCleared} / ${totalAssigned}</div>
                <div class="poster-progress-bar">
                  <div class="poster-progress-fill" style="width: ${bossClearPct}%"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="teams-container">
            ${teamsHtml}
          </div>
        `;

        container.appendChild(section);
      });

      updateGlobalStats();
    }

    function toggleSeal(bossId, teamIdx, slotIdx) {
      const boss = bosses.find(b => b.id === bossId);
      if (!boss) return;
      const member = boss.teams[teamIdx].members[slotIdx];
      if (!member.ign) return;

      if (member.status === 'READY') {
        member.status = 'CLEARED';
        playSfx('card-clear');
      } else if (member.status === 'CLEARED') {
        member.status = 'SUB';
        playSfx('card-sub');
      } else {
        member.status = 'READY';
        playSfx('card-click');
      }

      persist();
      render();
    }

    function handleTilt(e, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -10;
      const rotateY = ((x - centerX) / centerX) * 10;
      cardEl.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    }

    function resetTilt(cardEl) {
      cardEl.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.pill-tab').forEach(b => {
        b.classList.remove('active');
        if (b.textContent.toUpperCase().includes(cat === 'ALL' ? 'ALL' : cat)) {
          b.classList.add('active');
        }
      });
      playSfx('card-click');
      render();
    }

    function updateGlobalStats() {
      let totalAssigned = 0;
      let totalCleared = 0;
      bosses.forEach(b => {
        b.teams.forEach(t => {
          t.members.forEach(m => {
            if (m.ign) {
              totalAssigned++;
              if (m.status === 'CLEARED') totalCleared++;
            }
          });
        });
      });
      const pct = totalAssigned === 0 ? 0 : Math.round((totalCleared / totalAssigned) * 100);
      document.getElementById('global-clear-pct').textContent = `${pct}% (${totalCleared}/${totalAssigned})`;
    }

    function resetAllWeeklyStatus() {
      if (!confirm('Reset all member clearance statuses back to READY for the new week?')) return;
      bosses.forEach(b => {
        b.teams.forEach(t => {
          t.members.forEach(m => {
            if (m.ign) m.status = 'READY';
          });
        });
      });
      persist();
      render();
      showToast('🔄 All clearance statuses reset to READY!');
    }

    /* ==========================================================
       5. MODAL ASSIGNMENT / EDIT
       ========================================================== */
    function openModal(bossId, teamIdx, slotIdx) {
      const boss = bosses.find(b => b.id === bossId);
      if (!boss) return;
      const member = boss.teams[teamIdx].members[slotIdx];

      document.getElementById('target-boss-id').value = bossId;
      document.getElementById('target-team-idx').value = teamIdx;
      document.getElementById('target-slot-idx').value = slotIdx;

      document.getElementById('modal-title').textContent = member.ign 
        ? `Edit Raider (Slot ${slotIdx + 1})` 
        : `Assign Slot ${slotIdx + 1} (${boss.bossName})`;

      document.getElementById('modal-ign').value = member.ign || '';
      document.getElementById('modal-job').value = member.job || 'Hayato';
      document.getElementById('modal-cp').value = member.cp || '';
      document.getElementById('modal-role').value = member.role || 'Main DPS';

      document.getElementById('edit-modal').classList.add('show');
      playSfx('card-click');
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.remove('show');
    }

    function saveSlotAssignment() {
      const bossId = document.getElementById('target-boss-id').value;
      const teamIdx = parseInt(document.getElementById('target-team-idx').value);
      const slotIdx = parseInt(document.getElementById('target-slot-idx').value);

      const ign = document.getElementById('modal-ign').value.trim();
      const job = document.getElementById('modal-job').value;
      const cp = document.getElementById('modal-cp').value.trim();
      const role = document.getElementById('modal-role').value;

      if (!ign) {
        alert('Please enter an IGN for the character!');
        return;
      }

      const boss = bosses.find(b => b.id === bossId);
      if (boss) {
        boss.teams[teamIdx].members[slotIdx] = {
          ign,
          job,
          cp,
          role,
          status: 'READY'
        };
        persist();
        render();
        closeModal();
        playSfx('card-clear');
        showToast(`✨ ${ign} assigned to ${boss.bossName} - Team ${teamIdx + 1}!`);
      }
    }

    function clearCurrentSlot() {
      const bossId = document.getElementById('target-boss-id').value;
      const teamIdx = parseInt(document.getElementById('target-team-idx').value);
      const slotIdx = parseInt(document.getElementById('target-slot-idx').value);

      const boss = bosses.find(b => b.id === bossId);
      if (boss) {
        boss.teams[teamIdx].members[slotIdx] = {
          ign: "",
          job: "",
          cp: "",
          role: "",
          status: "READY"
        };
        persist();
        render();
        closeModal();
        playSfx('card-click');
        showToast('🗑️ Slot cleared.');
      }
    }

    /* ==========================================================
       6. RESET COUNTDOWN TIMER (Thursday 00:00 SGT)
       ========================================================== */
    function updateCountdown() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const serverTime = new Date(utc + 8 * 3600000);

      let target = new Date(serverTime);
      const day = serverTime.getDay();
      let diffDays = (4 - day + 7) % 7;
      if (diffDays === 0 && (serverTime.getHours() > 0 || serverTime.getMinutes() > 0 || serverTime.getSeconds() > 0)) {
        diffDays = 7;
      }
      target.setDate(serverTime.getDate() + diffDays);
      target.setHours(0, 0, 0, 0);

      const diff = target.getTime() - serverTime.getTime();
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);

      document.getElementById('live-countdown').textContent = `${d}d ${h}h ${m}m`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    /* ==========================================================
       7. DISCORD EXPORT
       ========================================================== */
    function copyDiscordRoster() {
      let out = `🎴 **UTENSILS EXPEDITION ROSTER • ASIA 2 SCANIA**\n`;
      bosses.forEach(b => {
        out += `\n⚔️ **${b.bossName} (${b.difficulty})**\n`;
        b.teams.forEach((t, tIdx) => {
          const filled = t.members.filter(m => m.ign);
          if (filled.length > 0) {
            out += `> **${t.name}** [${t.members.filter(m => m.ign && m.status === 'CLEARED').length}/${filled.length} Cleared]:\n`;
            filled.forEach(m => {
              const seal = m.status === 'CLEARED' ? '✅ [CLEARED]' : (m.status === 'SUB' ? '🚨 [SUB NEEDED]' : '🟡 [READY]');
              out += `> • ${seal} **${m.ign}** (${m.job} | ${m.cp ? m.cp + 'M' : 'N/A'} | ${m.role})\n`;
            });
          }
        });
      });

      navigator.clipboard.writeText(out).then(() => {
        playSfx('card-clear');
        showToast('✨ Discord Roster Copied to Clipboard!');
      });
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 3200);
    }

    function escapeStr(str) {
      return str.replace(/[&<>'"]/g, 
        t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)
      );
    }

    render();
  </script>
