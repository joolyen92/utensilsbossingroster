<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTENSILS • MapleStory M Expedition Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090b11;
      --bg-surface: #101422;
      --bg-card: rgba(18, 23, 38, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(139, 92, 246, 0.35);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, rgba(16, 20, 34, 0.6) 0%, rgba(9, 11, 17, 1) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    /* Top Catcha-Style Navigation Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(9, 11, 17, 0.85);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .server-pill {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .nav-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-family: 'Space Grotesk', monospace;
    }

    /* Hero Section with Collectible Dashboard Header */
    .hero-container {
      max-width: 1380px;
      margin: 32px auto 24px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }

    .headline h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 70%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .headline p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .btn-action.primary:hover {
      box-shadow: 0 8px 26px rgba(139, 92, 246, 0.6);
      transform: translateY(-2px);
    }

    /* Filter Pill Tabs (Catcha Style) */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .pill-tab {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-tab:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .pill-tab.active {
      background: #ffffff;
      color: #090b11;
      border-color: #ffffff;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.25);
      font-weight: 700;
    }

    /* Deck Sections */
    .decks-container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .deck-section {
      background: rgba(16, 20, 34, 0.4);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .deck-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .deck-emblem {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .deck-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .deck-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .deck-stats {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-clear-rate {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-family: 'Space Grotesk', monospace;
    }

    /* 3D Catcha-Style Trading Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
      perspective: 1200px;
    }

    /* Interactive Holographic Card */
    .gacha-card-wrapper {
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.25s ease-out, box-shadow 0.25s ease-out;
    }

    .gacha-card-wrapper:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .gacha-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      transition: border-color 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    /* Holographic Shimmer Sheen Layer */
    .card-holo-sheen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        125deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.03) 30%,
        rgba(236, 72, 153, 0.18) 45%,
        rgba(6, 182, 212, 0.2) 55%,
        rgba(255, 255, 255, 0.15) 60%,
        rgba(255, 255, 255, 0) 100%
      );
      mix-blend-mode: color-dodge;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .gacha-card-wrapper:hover .card-holo-sheen {
      opacity: 1;
    }

    /* Card Top Banner (Rarity & Stars) */
    .card-rarity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
      z-index: 2;
    }

    .rarity-pill {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .rarity-arcane {
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
    }
    .rarity-mythic {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #ffffff;
    }
    .rarity-legend {
      background: rgba(6, 182, 212, 0.2);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    .card-stars {
      color: #fbbf24;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
    }

    /* Card Artwork Display */
    .card-art-box {
      height: 120px;
      margin: 4px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .art-glow {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
      filter: blur(12px);
    }

    .character-avatar {
      font-size: 3.2rem;
      z-index: 2;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.6));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gacha-card-wrapper:hover .character-avatar {
      transform: scale(1.12);
    }

    /* Card Body & Info */
    .card-details {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    .card-char-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-job-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    /* Catcha Stat Bars (Power / Role) */
    .card-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-cell-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .stat-cell-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-cell-val.power {
      color: var(--accent-gold);
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    /* Clearance Foil Seal Status */
    .card-action-bar {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-foil-seal {
      width: 100%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .status-ready {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .status-cleared {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 182, 212, 0.2));
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
    }

    .status-sub {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.5);
      animation: alertPulse 1.4s infinite;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Modal Sheet */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 6, 12, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      background: #111524;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      width: 100%;
      max-width: 460px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .form-item {
      margin-bottom: 16px;
    }

    .form-item label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-field, .select-field {
      width: 100%;
      background: #090c17;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 11px 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 14px rgba(139, 92, 246, 0.3);
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-pill.visible {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      .hero-top-row { flex-direction: column; align-items: flex-start; }
      .nav-stats { display: none; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Catcha Navigation -->
  <nav class="navbar">
    <div class="brand-wrap">
      <div class="brand-logo">🎴</div>
      <div>
        <div class="brand-title">UTENSILS <span class="server-pill">Asia 2 • Scania</span></div>
      </div>
    </div>

    <div class="nav-stats">
      <div class="stat-pill">
        <span>Reset:</span>
        <strong id="live-countdown">--d --h --m</strong>
      </div>
      <div class="stat-pill">
        <span>Total Clears:</span>
        <strong id="global-clear-pct">0%</strong>
      </div>
    </div>
  </nav>

  <!-- Hero Header & Filter Bar -->
  <header class="hero-container">
    <div class="hero-top-row">
      <div class="headline">
        <h1>Bossing Expedition Cards</h1>
        <p>Interactive weekly commander roster. Tap any card to toggle clearance seals.</p>
      </div>

      <div class="hero-actions">
        <button class="btn-action" onclick="toggleMute()" id="sound-btn">🔊 SFX On</button>
        <button class="btn-action" onclick="copyDiscordRoster()">📋 Discord Export</button>
        <button class="btn-action primary" onclick="openAddModal()">✨ + Add Raider</button>
      </div>
    </div>

    <!-- Category Pill Carousel (Catcha Inspired) -->
    <div class="filter-bar">
      <button class="pill-tab active" onclick="setCategory('ALL')">✨ All Decks</button>
      <button class="pill-tab" onclick="setCategory('LOTUS')">⚡ Hard Lotus</button>
      <button class="pill-tab" onclick="setCategory('DAMIEN')">⚔️ Hard Damien</button>
      <button class="pill-tab" onclick="setCategory('LUCID')">🦋 Hard Lucid</button>
      <button class="pill-tab" onclick="setCategory('CRA')">👑 Chaos Root Abyss</button>
    </div>
  </header>

  <!-- Main Decks Container -->
  <main class="decks-container" id="decks-container">
    <!-- Rendered dynamically via JavaScript -->
  </main>

  <!-- Add Member Modal -->
  <div class="modal-backdrop" id="add-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✨ Mint Raider Card</h3>
        <button onclick="closeAddModal()" style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;">&times;</button>
      </div>

      <div class="form-item">
        <label>Select Expedition Deck</label>
        <select class="select-field" id="form-deck-id"></select>
      </div>

      <div class="form-item">
        <label>Character In-Game Name (IGN)</label>
        <input type="text" class="input-field" id="form-ign" placeholder="e.g. ShadowBlade">
      </div>

      <div class="form-item">
        <label>Class / Job</label>
        <select class="select-field" id="form-job">
          <option value="Night Walker">Night Walker</option>
          <option value="Bishop">Bishop</option>
          <option value="Sia Astelle">Sia Astelle</option>
          <option value="Paladin">Paladin</option>
          <option value="Shade">Shade</option>
          <option value="Dual Blade">Dual Blade</option>
          <option value="Buccaneer">Buccaneer</option>
          <option value="Hero">Hero</option>
          <option value="Bowmaster">Bowmaster</option>
          <option value="Luminous">Luminous</option>
          <option value="Phantom">Phantom</option>
          <option value="Adele">Adele</option>
        </select>
      </div>

      <div class="form-item">
        <label>Combat Power (Millions)</label>
        <input type="number" class="input-field" id="form-cp" placeholder="e.g. 55.4" step="0.5">
      </div>

      <div class="form-item">
        <label>Raid Role</label>
        <select class="select-field" id="form-role">
          <option value="Main DPS">Main DPS</option>
          <option value="Burst DPS">Burst DPS</option>
          <option value="Support / Shell">Support / Shell</option>
          <option value="Binder / Split">Binder / Split</option>
          <option value="Time Leap">Time Leap</option>
        </select>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
        <button class="btn-action" onclick="closeAddModal()">Cancel</button>
        <button class="btn-action primary" onclick="saveNewRaider()">Add to Roster</button>
      </div>
    </div>
  </div>

  <!-- Toast Alert -->
  <div class="toast-pill" id="toast">
    <span>✨ Discord Roster Copied to Clipboard!</span>
  </div>

  <script>
    /* ==========================================================
       1. DATA MODEL & LOCAL STORAGE
       ========================================================== */
    const DEFAULT_DECKS = [
      {
        id: 'deck-lotus',
        category: 'LOTUS',
        title: 'Hard Lotus Expedition',
        emblem: '⚡',
        difficulty: 'Hard Mode',
        mechanicTip: 'P1 Laser swap; Shell on P3 Purple Spheres.',
        members: [

    let decks = JSON.parse(localStorage.getItem('catcha_msm_roster_data')) || DEFAULT_DECKS;
    let activeCategory = 'ALL';
    let sfxMuted = false;

    function persist() {
      localStorage.setItem('catcha_msm_roster_data', JSON.stringify(decks));
      updateGlobalStats();
    }

    /* ==========================================================
       2. TACTILE AUDIO SYNTHESIZER (Card Flips & Foil Seals)
       ========================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function playSfx(type) {
      if (sfxMuted) return;
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();

      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if (type === 'foil-tap') {
        // High crisp card snap
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.06);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
        osc.start(t);
        osc.stop(t + 0.07);
      } else if (type === 'foil-clear') {
        // Shimmering chime chord
        [1046.5, 1318.5, 1567.9, 2093.0].forEach((freq, idx) => {
          const o = actx.createOscillator();
          const g = actx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, t + idx * 0.05);
          g.gain.setValueAtTime(0.1, t + idx * 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.22);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t + idx * 0.05);
          o.stop(t + idx * 0.05 + 0.23);
        });
      } else if (type === 'foil-sub') {
        // Warning buzz blip
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.linearRampToValueAtTime(180, t + 0.12);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.start(t);
        osc.stop(t + 0.13);
      }
    }

    function toggleMute() {
      sfxMuted = !sfxMuted;
      document.getElementById('sound-btn').textContent = sfxMuted ? '🔇 SFX Off' : '🔊 SFX On';
    }

    /* ==========================================================
       3. RENDER CARDS & DECK VIEWS
       ========================================================== */
    function render() {
      const container = document.getElementById('decks-container');
      container.innerHTML = '';

      const filtered = activeCategory === 'ALL' 
        ? decks 
        : decks.filter(d => d.category === activeCategory);

      filtered.forEach(deck => {
        const clearedCount = deck.members.filter(m => m.status === 'CLEARED').length;
        const totalCount = deck.members.length;
        const clearPct = Math.round((clearedCount / totalCount) * 100) || 0;

        const section = document.createElement('section');
        section.className = 'deck-section';

        let cardsHtml = '';
        deck.members.forEach((m, idx) => {
          const sealText = m.status === 'CLEARED' ? '✦ CLEARED' : (m.status === 'SUB' ? '⚠ SUB NEEDED' : 'READY');
          const sealClass = m.status === 'CLEARED' ? 'status-cleared' : (m.status === 'SUB' ? 'status-sub' : 'status-ready');

          cardsHtml += `
            <div class="gacha-card-wrapper" onclick="toggleSeal('${deck.id}', ${idx})" onmousemove="handleTilt(event, this)" onmouseleave="resetTilt(this)">
              <div class="gacha-card">
                <div class="card-holo-sheen"></div>
                
                <div class="card-rarity-row">
                  <span class="rarity-pill rarity-${m.rarity}">${m.rarity}</span>
                  <span class="card-stars">${m.stars}</span>
                </div>

                <div class="card-art-box">
                  <div class="art-glow"></div>
                  <div class="character-avatar">${m.avatar}</div>
                </div>

                <div class="card-details">
                  <div class="card-char-name">
                    <span>${escapeStr(m.ign)}</span>
                    <span class="card-job-badge">${escapeStr(m.job)}</span>
                  </div>

                  <div class="card-stats-grid">
                    <div class="stat-cell">
                      <span class="stat-cell-label">Combat Power</span>
                      <span class="stat-cell-val power">${m.cp}</span>
                    </div>
                    <div class="stat-cell">
                      <span class="stat-cell-label">Assigned Role</span>
                      <span class="stat-cell-val">${m.role}</span>
                    </div>
                  </div>

                  <div class="card-action-bar">
                    <div class="status-foil-seal ${sealClass}">
                      ${sealText}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        section.innerHTML = `
          <div class="deck-header">
            <div class="deck-info">
              <div class="deck-emblem">${deck.emblem}</div>
              <div>
                <div class="deck-title">${escapeStr(deck.title)}</div>
                <div class="deck-meta">${escapeStr(deck.difficulty)} • ${escapeStr(deck.mechanicTip)}</div>
              </div>
            </div>
            <div class="deck-stats">
              <span class="badge-clear-rate">${clearedCount}/${totalCount} Cleared (${clearPct}%)</span>
            </div>
          </div>

          <div class="card-grid">
            ${cardsHtml}
          </div>
        `;

        container.appendChild(section);
      });

      updateGlobalStats();
    }

    function toggleSeal(deckId, idx) {
      const deck = decks.find(d => d.id === deckId);
      if (!deck) return;
      const member = deck.members[idx];

      if (member.status === 'READY') {
        member.status = 'CLEARED';
        playSfx('foil-clear');
      } else if (member.status === 'CLEARED') {
        member.status = 'SUB';
        playSfx('foil-sub');
      } else {
        member.status = 'READY';
        playSfx('foil-tap');
      }

      persist();
      render();
    }

    /* 3D Dynamic Card Tilt & Sheen following mouse (Catcha style) */
    function handleTilt(e, cardEl) {
      const rect = cardEl.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -10;
      const rotateY = ((x - centerX) / centerX) * 10;

      cardEl.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    }

    function resetTilt(cardEl) {
      cardEl.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.pill-tab').forEach(b => {
        b.classList.remove('active');
        if (b.textContent.toUpperCase().includes(cat === 'ALL' ? 'ALL' : cat)) {
          b.classList.add('active');
        }
      });
      playSfx('foil-tap');
      render();
    }

    function updateGlobalStats() {
      let total = 0;
      let cleared = 0;
      decks.forEach(d => {
        total += d.members.length;
        cleared += d.members.filter(m => m.status === 'CLEARED').length;
      });
      const pct = total === 0 ? 0 : Math.round((cleared / total) * 100);
      document.getElementById('global-clear-pct').textContent = `${pct}% (${cleared}/${total})`;
    }

    /* ==========================================================
       4. RESET COUNTDOWN TIMER
       ========================================================== */
    function updateCountdown() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const serverTime = new Date(utc + 8 * 3600000); // UTC+8 SGT

      let target = new Date(serverTime);
      const day = serverTime.getDay();
      let diffDays = (4 - day + 7) % 7;
      if (diffDays === 0 && (serverTime.getHours() > 0 || serverTime.getMinutes() > 0 || serverTime.getSeconds() > 0)) {
        diffDays = 7;
      }
      target.setDate(serverTime.getDate() + diffDays);
      target.setHours(0, 0, 0, 0);

      const diff = target.getTime() - serverTime.getTime();
      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const m = Math.floor((diff / (1000 * 60)) % 60);

      document.getElementById('live-countdown').textContent = `${d}d ${h}h ${m}m`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    /* ==========================================================
       5. MODAL & ADD RAIDER
       ========================================================== */
    const jobAvatars = {
      'Night Walker': '🥷', 'Bishop': '✨', 'Sia Astelle': '⭐', 'Paladin': '🛡️',
      'Shade': '👊', 'Dual Blade': '⚔️', 'Buccaneer': '⚡', 'Hero': '🪓',
      'Bowmaster': '🏹', 'Luminous': '🔮', 'Phantom': '🃏', 'Adele': '🗡️'
    };

    function openAddModal() {
      const select = document.getElementById('form-deck-id');
      select.innerHTML = decks.map(d => `<option value="${d.id}">${escapeStr(d.title)}</option>`).join('');
      document.getElementById('add-modal').classList.add('show');
      playSfx('foil-tap');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('show');
    }

    function saveNewRaider() {
      const deckId = document.getElementById('form-deck-id').value;
      const ign = document.getElementById('form-ign').value.trim();
      const job = document.getElementById('form-job').value;
      const cpVal = document.getElementById('form-cp').value.trim() || '45';
      const role = document.getElementById('form-role').value;

      if (!ign) {
        alert('Please enter an IGN!');
        return;
      }

      const deck = decks.find(d => d.id === deckId);
      if (deck) {
        deck.members.push({
          ign: ign,
          job: job,
          avatar: jobAvatars[job] || '⚔️',
          cp: `${cpVal}M`,
          role: role,
          stars: '★★★★★',
          rarity: parseFloat(cpVal) >= 60 ? 'arcane' : (parseFloat(cpVal) >= 50 ? 'mythic' : 'legend'),
          status: 'READY'
        });
        persist();
        render();
        closeAddModal();
        playSfx('foil-clear');
        document.getElementById('form-ign').value = '';
        document.getElementById('form-cp').value = '';
      }
    }

    /* ==========================================================
       6. DISCORD EXPORT
       ========================================================== */
    function copyDiscordRoster() {
      let out = `🎴 **UTENSILS EXPEDITION CARDS • ASIA 2 SCANIA**\n`;
      decks.forEach(d => {
        const clears = d.members.filter(m => m.status === 'CLEARED').length;
        out += `\n**${d.title}** [${clears}/${d.members.length} Cleared]\n`;
        d.members.forEach(m => {
          const seal = m.status === 'CLEARED' ? '✅ [CLEARED]' : (m.status === 'SUB' ? '🚨 [SUB NEEDED]' : '🟡 [READY]');
          out += `• ${seal} **${m.ign}** (${m.job} | ${m.cp} | ${m.role})\n`;
        });
      });

      navigator.clipboard.writeText(out).then(() => {
        playSfx('foil-clear');
        const toast = document.getElementById('toast');
        toast.classList.add('visible');
        setTimeout(() => toast.classList.remove('visible'), 3200);
      });
    }

    function escapeStr(str) {
      return str.replace(/[&<>'"]/g, 
        t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)
      );
    }

    render();
  </script>
